name: Bug Report
description: Report a bug or unexpected behavior in ProcessPilot
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include secrets, tokens, or credentials anywhere in this report — including screenshots and logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, ideally in a GitHub Codespace or Vercel preview.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Codespace, Vercel preview URL, or production URL
      placeholder: e.g. https://processpilot-git-feature-x.vercel.app
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any relevant output. This will be rendered as code, so no need for backticks. Redact any secrets before pasting.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have confirmed this report contains no secrets or credentials
          required: true
