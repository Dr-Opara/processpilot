name: Preview checks

# Fires when Vercel's GitHub integration reports a deployment status. Until
# the repository is connected to Vercel (see docs/development/cloud-development.md
# and the Vercel section of the project README), no such event exists and
# this workflow simply never runs — no changes needed when Vercel is wired
# up later.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke-test-preview:
    name: Smoke test Vercel preview
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for preview to be reachable
        run: |
          url="${{ github.event.deployment_status.target_url }}"
          echo "Checking $url"
          for i in $(seq 1 10); do
            if curl -sSf -o /dev/null "$url"; then
              echo "Preview is reachable."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Preview never became reachable at $url"
          exit 1

      - name: Run browser smoke tests against preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
