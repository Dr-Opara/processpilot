name: Apply ProcessPilot content fix v2

on:
  push:
    branches:
      - processpilot-content-fix
    paths:
      - .github/workflows/apply-processpilot-content-fix-v2.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: processpilot-content-fix
          persist-credentials: true

      - name: Apply content updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/site.tsx')
          s = p.read_text()
          if 'contact@processpilottech.com' not in s:
              raise SystemExit('Old email not found')
          s = s.replace('contact@processpilottech.com', 'contract@processpilottech.com')
          if '2026 – Present' not in s:
              raise SystemExit('Old AGE term not found')
          s = s.replace('2026 – Present', '2026 – 2028')
          if 'Supporting the DoD / DISA mission through our prime contractor' not in s:
              start = s.index('function AgeSolutionsDetail()')
              marker = '      />\n      <section className="wrap split ageMission">'
              pos = s.index(marker, start)
              block = '      />\n      <section className="wrap">\n        <div className="notice agePrimeNotice">\n          <b>Supporting the DoD / DISA mission through our prime contractor</b>\n          <p>We are thrilled to support DoD / DISA in AI engineering and emerging technology as a subcontractor to AGE Solutions, our prime contractor. Through this engagement, ProcessPilot Technologies contributes secure AI engineering, emerging technology evaluation, AI security, and mission-focused technical support in alignment with applicable federal and customer requirements.</p>\n        </div>\n      </section>\n      <section className="wrap split ageMission">'
              s = s[:pos] + s[pos:].replace(marker, block, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "ProcessPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/apply-processpilot-content-fix-v2.yml
          git rm -f .github/workflows/apply-processpilot-content-fix.yml
          git rm -f .github/workflows/processpilot-content-update.yml
          git add app/site.tsx
          git commit -m "Update AGE engagement term, subcontractor statement, and contracts email"
          git push origin HEAD:processpilot-content-fix
