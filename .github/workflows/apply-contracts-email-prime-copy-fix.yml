name: Apply contracts email and prime copy fix

on:
  push:
    branches:
      - contracts-email-prime-copy-fix
    paths:
      - .github/workflows/apply-contracts-email-prime-copy-fix.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: contracts-email-prime-copy-fix
          persist-credentials: true

      - name: Apply requested updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/site.tsx')
          site = path.read_text()

          # Update all public website email references and mailto links.
          site = site.replace('contract@processpilottech.com', 'contracts@processpilottech.com')
          site = site.replace('contact@processpilottech.com', 'contracts@processpilottech.com')

          # Remove the prime contractor's name from the subcontractor statement.
          site = site.replace(
              'We are thrilled to support DoD / DISA in AI engineering and emerging technology as a subcontractor to AGE Solutions, our prime contractor. Through this engagement, ProcessPilot Technologies contributes secure AI engineering, emerging technology evaluation, AI security, and mission-focused technical support in alignment with applicable federal and customer requirements.',
              'We are thrilled to support DoD / DISA in AI engineering and emerging technology as a subcontractor through our prime contractor. Through this engagement, ProcessPilot Technologies contributes secure AI engineering, emerging technology evaluation, AI security, and mission-focused technical support in alignment with applicable federal and customer requirements.'
          )

          path.write_text(site)
          PY

      - name: Verify requested content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          site = Path('app/site.tsx').read_text()
          assert 'contract@processpilottech.com' not in site
          assert 'contact@processpilottech.com' not in site
          assert 'contracts@processpilottech.com' in site
          assert 'subcontractor to AGE Solutions, our prime contractor' not in site
          assert 'as a subcontractor through our prime contractor' in site
          assert 'mailto:contracts@processpilottech.com' in site
          print('Content verification passed')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "ProcessPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-contracts-email-prime-copy-fix.yml
          git add app/site.tsx
          git commit -m "Update contracts email and subcontractor wording"
          git push origin HEAD:contracts-email-prime-copy-fix
