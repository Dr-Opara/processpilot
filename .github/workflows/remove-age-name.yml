name: Remove AGE Solutions name from public engagement

on:
  push:
    branches:
      - remove-age-name
    paths:
      - .github/workflows/remove-age-name.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: remove-age-name
          persist-credentials: true

      - name: Update public engagement naming and route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          site_path = Path('app/site.tsx')
          site = site_path.read_text()

          site = site.replace('AGE Solutions | DoD / DISA', 'Sub Contractor | DoD/DISA')
          site = site.replace('/engagements/age-solutions', '/engagements/dod-disa-subcontractor')
          site = site.replace('<p><b>Client:</b> AGE Solutions</p>', '<p><b>Engagement:</b> Subcontractor AI Engineering Support</p>')
          site = site.replace('internal AGE Solutions information', 'prime-contractor or customer proprietary information')
          site = site.replace('AgeSolutionsDetail', 'DodDisaSubcontractorDetail')
          site = site.replace('AgeSolutionsPage', 'DodDisaSubcontractorPage')

          if 'AGE Solutions' in site or 'age-solutions' in site:
              raise SystemExit('Public AGE Solutions reference remains in app/site.tsx')

          site_path.write_text(site)

          old_route = Path('app/engagements/age-solutions/page.tsx')
          if old_route.exists():
              old_route.unlink()
              try:
                  old_route.parent.rmdir()
              except OSError:
                  pass

          new_route = Path('app/engagements/dod-disa-subcontractor/page.tsx')
          new_route.parent.mkdir(parents=True, exist_ok=True)
          new_route.write_text('''import type { Metadata } from "next";\nimport { DodDisaSubcontractorPage } from "../../site";\n\nexport const metadata: Metadata = {\n  title: "Sub Contractor | DoD/DISA | ProcessPilot Technologies",\n  description: "Artificial Intelligence engineering and emerging technology support focused on secure GenAI, agentic AI, RAG, AI/ML evaluation, AI security, and operational deployment in DoD mission environments.",\n};\n\nexport default function Page() {\n  return <DodDisaSubcontractorPage />;\n}\n''')

          sitemap_path = Path('app/sitemap.ts')
          sitemap = sitemap_path.read_text()
          sitemap = sitemap.replace('/engagements/age-solutions', '/engagements/dod-disa-subcontractor')
          if 'age-solutions' in sitemap or 'AGE Solutions' in sitemap:
              raise SystemExit('AGE Solutions reference remains in sitemap')
          sitemap_path.write_text(sitemap)
          PY

      - name: Verify public app contains no AGE Solutions references
        shell: bash
        run: |
          if grep -RniE 'AGE Solutions|age-solutions' app; then
            echo 'AGE Solutions reference still exists under app/'
            exit 1
          fi
          grep -Rni 'Sub Contractor | DoD/DISA' app/site.tsx app/engagements/dod-disa-subcontractor/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "ProcessPilot Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/remove-age-name.yml
          git add -A app
          git commit -m "Replace AGE Solutions branding with DoD DISA subcontractor engagement"
          git push origin HEAD:remove-age-name
